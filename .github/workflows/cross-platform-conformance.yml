name: Cross-platform conformance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0

      - name: Install locked dependencies
        run: npm ci

      - name: Run product and security tests
        run: npm test

      - name: Verify package
        run: npm run test:package

      - name: Check schemas
        run: npm run check:schemas

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Generate platform report
        run: >-
          npm run conformance:cross-platform --
          --output conformance-${{ runner.os }}.json
          --run-id ${{ github.run_id }}
          --git-sha ${{ github.sha }}

      - name: Upload immutable platform report
        uses: actions/upload-artifact@v7
        with:
          name: conformance-${{ runner.os }}
          path: conformance-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare deterministic results
    needs: conformance
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0

      - name: Install locked dependencies
        run: npm ci

      - name: Download platform reports
        uses: actions/download-artifact@v8
        with:
          pattern: conformance-*
          path: conformance-reports
          merge-multiple: true

      - name: Compare platform reports
        run: >-
          npm run conformance:cross-platform --
          --compare conformance-reports
          --output cross-platform-summary.json

      - name: Upload immutable comparison summary
        uses: actions/upload-artifact@v7
        with:
          name: cross-platform-conformance-summary
          path: cross-platform-summary.json
          if-no-files-found: error
          retention-days: 30

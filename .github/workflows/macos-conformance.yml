name: macOS conformance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: macOS conformance
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0

      - name: Install locked dependencies
        run: npm ci

      - name: Run product and security tests
        run: npm test

      - name: Verify package
        run: npm run test:package

      - name: Check schemas
        run: npm run check:schemas

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Generate macOS report
        run: >-
          npm run conformance:macos --
          --output macos-conformance.json
          --run-id ${{ github.run_id }}
          --git-sha ${{ github.sha }}

      - name: Upload immutable macOS report
        uses: actions/upload-artifact@v7
        with:
          name: macos-conformance-${{ github.run_id }}
          path: macos-conformance.json
          if-no-files-found: error
          retention-days: 30
